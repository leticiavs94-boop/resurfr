<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Quote</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #F4F5F0; min-height: 100vh; padding: 20px 16px 60px; }
    .card { background: white; border-radius: 16px; max-width: 520px; margin: 0 auto; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }

    /* Header */
    .header { background: linear-gradient(135deg, #1E4D35, #2A6B47); padding: 24px 24px 20px; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .biz-name { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; color: white; }
    .est-num { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.6); letter-spacing: 1.5px; }
    .header-meta { display: flex; gap: 16px; flex-wrap: wrap; }
    .meta-item { font-size: 12px; color: rgba(255,255,255,0.75); }
    .meta-item strong { color: white; }

    /* From/To */
    .from-to { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid #F0F0F0; }
    .from-to-col { padding: 16px 20px; }
    .from-to-col:first-child { border-right: 1px solid #F0F0F0; }
    .ft-label { font-size: 9px; font-weight: 800; letter-spacing: 2px; color: #999; text-transform: uppercase; margin-bottom: 6px; }
    .ft-name { font-size: 14px; font-weight: 700; color: #1a1a1a; }
    .ft-detail { font-size: 11px; color: #666; margin-top: 3px; }

    /* Line items */
    .section-title { padding: 14px 20px 8px; font-size: 13px; font-weight: 700; color: #333; border-bottom: 1px solid #F0F0F0; }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #F8F8F8; }
    th { padding: 8px 12px; font-size: 9px; font-weight: 800; color: #999; letter-spacing: 1px; text-transform: uppercase; text-align: left; }
    th:last-child, td:last-child { text-align: right; padding-right: 20px; }
    th:nth-child(2), td:nth-child(2) { text-align: center; }
    th:nth-child(3), td:nth-child(3) { text-align: right; }
    td { padding: 11px 12px; font-size: 13px; color: #333; border-top: 1px solid #F5F5F5; }
    tr:nth-child(even) td { background: #FAFAFA; }

    /* Totals */
    .totals { padding: 14px 20px; display: flex; justify-content: flex-end; border-top: 2px solid #F0F0F0; }
    .totals-inner { width: 200px; }
    .total-row { display: flex; justify-content: space-between; font-size: 13px; color: #666; padding: 4px 0; }
    .total-due { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg,#1E4D35,#2A6B47); border-radius: 10px; padding: 12px 14px; margin-top: 8px; }
    .total-due span:first-child { font-size: 13px; font-weight: 800; color: white; }
    .total-due span:last-child { font-size: 18px; font-weight: 900; color: #C8E62B; font-family: 'Barlow Condensed', sans-serif; }

    /* Notes */
    .notes { margin: 0 20px 16px; padding: 12px 14px; background: #FFFBEB; border-left: 3px solid #C8E62B; border-radius: 0 8px 8px 0; font-size: 12px; color: #666; line-height: 1.6; }

    /* Action section */
    .action-section { padding: 20px; border-top: 2px solid #F0F0F0; }
    .action-title { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 14px; text-align: center; }
    .action-btns { display: flex; gap: 10px; }
    .btn-accept { flex: 1; padding: 14px; border-radius: 10px; background: #16A34A; color: white; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; border: none; }
    .btn-decline { flex: 1; padding: 14px; border-radius: 10px; background: #F8F8F8; color: #666; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid #E0E0E0; }
    .btn-accept:disabled, .btn-decline:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Decline reason */
    .decline-box { margin-top: 12px; display: none; }
    .decline-box textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #E0E0E0; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; resize: none; outline: none; color: #333; }
    .decline-box textarea:focus { border-color: #1E4D35; }
    .btn-submit-decline { width: 100%; margin-top: 8px; padding: 12px; border-radius: 10px; background: #1E4D35; color: white; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }

    /* States */
    .state-msg { text-align: center; padding: 28px 20px; }
    .state-emoji { font-size: 48px; margin-bottom: 12px; }
    .state-title { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; color: #1a1a1a; margin-bottom: 6px; }
    .state-sub { font-size: 13px; color: #666; line-height: 1.5; }

    /* Footer */
    .footer { text-align: center; margin-top: 20px; font-size: 11px; color: #aaa; }
    .footer a { color: #1E4D35; text-decoration: none; font-weight: 600; }

    /* Loading */
    .loading { text-align: center; padding: 60px 20px; color: #999; font-size: 14px; }
  </style>
</head>
<body>

<div class="card" id="main-card">
  <div class="loading" id="loading-state">Loading your quote...</div>
</div>

<div class="footer">Powered by <a href="https://getresurfr.netlify.app">Resurfr</a></div>

<script>
const { createClient } = supabase;
const sb = createClient(
  'https://qyrgkspwxjmbjnkaixag.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5cmdrc3B3eGptYmpua2FpeGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5NzQ0NTgsImV4cCI6MjA4NzU1MDQ1OH0.AHE_1iR8De17u-bVwsfzPc0nKK8MCDB5SEU5Ks531DA'
);

const fmt = n => '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' }) : '';

function fmtTime(t) {
  if (!t) return '';
  const [h, m] = t.split(':');
  const hr = parseInt(h);
  return (hr > 12 ? hr - 12 : hr || 12) + ':' + m + ' ' + (hr >= 12 ? 'PM' : 'AM');
}

async function loadQuote() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const card = document.getElementById('main-card');

  if (!id) {
    card.innerHTML = `<div class="state-msg"><div class="state-emoji">🔍</div><div class="state-title">Quote Not Found</div><div class="state-sub">This link doesn't seem right. Please check with your contractor.</div></div>`;
    return;
  }

  // Load quote + business profile
  const { data: q, error } = await sb.from('quotes').select('*').eq('id', id).single();

  if (error || !q) {
    card.innerHTML = `<div class="state-msg"><div class="state-emoji">😕</div><div class="state-title">Quote Not Found</div><div class="state-sub">This quote may have been removed or the link is incorrect.</div></div>`;
    return;
  }

  // Load business profile for this contractor
  const { data: profile } = await sb.from('business_profiles').select('*').eq('user_id', q.user_id).single();
  const biz = profile || {};

  // Parse lines
  const lines = typeof q.lines === 'string' ? JSON.parse(q.lines) : (q.lines || []);
  const subtotal = lines.reduce((a, l) => a + (l.q * l.p), 0);
  const tax = subtotal * ((q.tax || 0) / 100);
  const total = subtotal + tax;

  // Already responded
  if (q.status === 'approved') {
    card.innerHTML = `<div class="state-msg"><div class="state-emoji">✅</div><div class="state-title">Quote Accepted!</div><div class="state-sub">You've already accepted this quote. ${biz.name || 'Your contractor'} will be in touch shortly.</div></div>`;
    return;
  }
  if (q.status === 'declined') {
    card.innerHTML = `<div class="state-msg"><div class="state-emoji">✖</div><div class="state-title">Quote Declined</div><div class="state-sub">You've declined this quote. Contact ${biz.name || 'your contractor'} if you'd like to discuss further.</div></div>`;
    return;
  }

  // Logo
  const logoHtml = biz.logo_url
    ? `<img src="${biz.logo_url}" style="height:44px;max-width:100px;object-fit:contain;border-radius:6px">`
    : `<div class="biz-name">${biz.name || 'Your Contractor'}</div>`;

  card.innerHTML = `
    <!-- HEADER -->
    <div class="header">
      <div class="header-top">
        ${logoHtml}
        <div style="text-align:right">
          <div class="est-num">ESTIMATE #${String(q.id).slice(-6).toUpperCase()}</div>
          ${q.valid_until ? `<div style="font-size:11px;color:rgba(255,255,255,0.6);margin-top:4px">Valid until ${fmtDate(q.valid_until)}</div>` : ''}
        </div>
      </div>
      ${q.job_date ? `<div class="header-meta"><div class="meta-item">📅 <strong>${fmtDate(q.job_date)}${q.job_time ? ' at ' + fmtTime(q.job_time) : ''}</strong></div></div>` : ''}
    </div>

    <!-- FROM / TO -->
    <div class="from-to">
      <div class="from-to-col">
        <div class="ft-label">From</div>
        <div class="ft-name">${biz.name || 'Your Contractor'}</div>
        ${biz.phone ? `<div class="ft-detail">📞 ${biz.phone}</div>` : ''}
        ${biz.email ? `<div class="ft-detail">✉ ${biz.email}</div>` : ''}
        ${biz.city ? `<div class="ft-detail">📍 ${biz.city}${biz.state ? ', ' + biz.state : ''}</div>` : ''}
      </div>
      <div class="from-to-col">
        <div class="ft-label">Prepared For</div>
        <div class="ft-name">${q.client_name || 'You'}</div>
        ${q.client_email ? `<div class="ft-detail">${q.client_email}</div>` : ''}
      </div>
    </div>

    <!-- LINE ITEMS -->
    <div class="section-title">${q.title || 'Services'}</div>
    <table>
      <thead><tr><th>Description</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead>
      <tbody>
        ${lines.map(l => `<tr><td>${l.d}</td><td style="text-align:center">${l.q}</td><td style="text-align:right">${fmt(l.p)}</td><td>${fmt(l.q * l.p)}</td></tr>`).join('')}
      </tbody>
    </table>

    <!-- TOTALS -->
    <div class="totals">
      <div class="totals-inner">
        <div class="total-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
        ${q.tax ? `<div class="total-row"><span>Tax (${q.tax}%)</span><span>${fmt(tax)}</span></div>` : ''}
        <div class="total-due"><span>TOTAL DUE</span><span>${fmt(total)}</span></div>
      </div>
    </div>

    <!-- NOTES -->
    ${q.notes ? `<div class="notes">${q.notes}</div>` : ''}

    <!-- ACTION -->
    <div class="action-section" id="action-section">
      <div class="action-title">Ready to move forward?</div>
      <div class="action-btns">
        <button class="btn-accept" onclick="acceptQuote('${q.id}')">✓ Accept Quote</button>
        <button class="btn-decline" onclick="showDecline()">Decline</button>
      </div>
      <div class="decline-box" id="decline-box">
        <textarea id="decline-reason" rows="3" placeholder="Let us know why you're declining (optional)..."></textarea>
        <button class="btn-submit-decline" onclick="declineQuote('${q.id}')">Submit &amp; Decline</button>
      </div>
    </div>
  `;
}

function showDecline() {
  const box = document.getElementById('decline-box');
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

async function acceptQuote(id) {
  const btn = document.querySelector('.btn-accept');
  btn.textContent = 'Accepting...';
  btn.disabled = true;
  document.querySelector('.btn-decline').disabled = true;

  const { error } = await sb.from('quotes').update({ status: 'approved' }).eq('id', id);

  if (error) {
    btn.textContent = '✓ Accept Quote';
    btn.disabled = false;
    document.querySelector('.btn-decline').disabled = false;
    alert('Something went wrong. Please try again.');
    return;
  }

  document.getElementById('main-card').innerHTML = `
    <div class="state-msg">
      <div class="state-emoji">🎉</div>
      <div class="state-title">Quote Accepted!</div>
      <div class="state-sub">Thank you! Your contractor has been notified and will be in touch shortly to confirm the details.</div>
    </div>
  `;
}

async function declineQuote(id) {
  const reason = document.getElementById('decline-reason').value.trim();
  const btn = document.querySelector('.btn-submit-decline');
  btn.textContent = 'Submitting...';
  btn.disabled = true;

  const { error } = await sb.from('quotes').update({
    status: 'declined',
    decline_reason: reason || null
  }).eq('id', id);

  if (error) {
    btn.textContent = 'Submit & Decline';
    btn.disabled = false;
    alert('Something went wrong. Please try again.');
    return;
  }

  document.getElementById('main-card').innerHTML = `
    <div class="state-msg">
      <div class="state-emoji">👋</div>
      <div class="state-title">Got it, thanks.</div>
      <div class="state-sub">Your response has been sent.${reason ? ' Your feedback helps us improve.' : ''} Feel free to reach out if you change your mind.</div>
    </div>
  `;
}

loadQuote();
</script>
</body>
</html>
